name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck build.sh
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  # Reads the pin once, so the other jobs build and package the same commit.
  pin:
    name: Pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pin names a commit or a release; see README.md. CI builds the
      # binary from source at a commit. It does not download release
      # binaries yet.
      - name: Read cheesecloth.pin
        id: pin
        run: |
          pin=$(python3 -c 'import json, sys, tomllib; print(json.dumps(tomllib.load(sys.stdin.buffer)))' < cheesecloth.pin)
          case $(jq -c 'keys' <<< "$pin") in
            '["commit"]')
              commit=$(jq -r .commit <<< "$pin")
              if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::the commit in cheesecloth.pin is not a full SHA-1: $commit"
                exit 1
              fi
              echo "commit=$commit" >> "$GITHUB_OUTPUT"
              ;;
            '["release","sha256"]')
              release=$(jq -r .release <<< "$pin")
              if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::the release in cheesecloth.pin is not a version: $release"
                exit 1
              fi
              if ! jq -e '.sha256 | keys == ["aarch64-apple-darwin", "x86_64-apple-darwin"]
                  and all(.[]; type == "string" and test("^[0-9a-f]{64}$"))' <<< "$pin" > /dev/null; then
                echo "::error::[sha256] in cheesecloth.pin must hold a SHA-256 for aarch64-apple-darwin and x86_64-apple-darwin"
                exit 1
              fi
              echo "::error::CI does not download release binaries yet; pin a commit"
              exit 1
              ;;
            *)
              echo "::error::cheesecloth.pin must hold either \"commit\", or \"release\" and [sha256]"
              exit 1
              ;;
          esac

  # Builds cheesecloth at the pinned commit. The tests run in cheesecloth's
  # own CI.
  binary:
    name: Binary (${{ matrix.arch }})
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.commit }}
          persist-credentials: false
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-binary-${{ matrix.arch }}
          path: target/release/cheesecloth
          if-no-files-found: error

  # Builds the installer from the binary that the binary job built. It never
  # runs cargo.
  installer:
    name: Installer (${{ matrix.arch }})
    needs: [pin, binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The README, LICENSE, notices and docs that the installer holds, from
      # the commit that built the binary.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.commit }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-binary-${{ matrix.arch }}
          path: target/bin
      # Artifacts do not keep file modes.
      - name: Build installer
        run: |
          chmod +x target/bin/cheesecloth
          bash build.sh target/bin/cheesecloth cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesecloth-macos-${{ matrix.arch }}
          path: dist/*.pkg
          if-no-files-found: error
          compression-level: 0
