name: CI

on:
  push:
    branches: [main]
    # A package release: v<release>-<revision>. See README.md.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck build.sh
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  # Reads the pin once, so the other jobs build and package the same commit.
  pin:
    name: Pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Set for a commit pin.
      commit: ${{ steps.pin.outputs.commit }}
      # Set for a release pin: the version, and the SHA-256 of each binary
      # as a JSON object.
      release: ${{ steps.pin.outputs.release }}
      sha256: ${{ steps.pin.outputs.sha256 }}
      # The cheesecloth commit or tag that the binary comes from.
      ref: ${{ steps.pin.outputs.ref }}
      # For a tag: <release>-<revision>.
      package: ${{ steps.pin.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pin names a commit or a release; see README.md.
      - name: Read cheesecloth.pin
        id: pin
        run: |
          pin=$(python3 -c 'import json, sys, tomllib; print(json.dumps(tomllib.load(sys.stdin.buffer)))' < cheesecloth.pin)
          case $(jq -c 'keys' <<< "$pin") in
            '["commit"]')
              commit=$(jq -r .commit <<< "$pin")
              if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::the commit in cheesecloth.pin is not a full SHA-1: $commit"
                exit 1
              fi
              echo "commit=$commit" >> "$GITHUB_OUTPUT"
              echo "ref=$commit" >> "$GITHUB_OUTPUT"
              ;;
            '["release","sha256"]')
              release=$(jq -r .release <<< "$pin")
              # The tag without its "v": X.Y.Z, maybe with a suffix such as
              # "pre0", as cheesecloth's release check allows.
              if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z-][0-9a-z.-]*)?$ ]]; then
                echo "::error::the release in cheesecloth.pin is not a version: $release"
                exit 1
              fi
              if ! jq -e '.sha256 | keys == ["aarch64-apple-darwin", "x86_64-apple-darwin"]
                  and all(.[]; type == "string" and test("^[0-9a-f]{64}$"))' <<< "$pin" > /dev/null; then
                echo "::error::[sha256] in cheesecloth.pin must hold a SHA-256 for aarch64-apple-darwin and x86_64-apple-darwin"
                exit 1
              fi
              echo "release=$release" >> "$GITHUB_OUTPUT"
              echo "sha256=$(jq -c .sha256 <<< "$pin")" >> "$GITHUB_OUTPUT"
              echo "ref=v$release" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::cheesecloth.pin must hold either \"commit\", or \"release\" and [sha256]"
              exit 1
              ;;
          esac
          # A tag is a package release of the pinned release.
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ -z "${release:-}" ]]; then
              echo "::error::tag $GITHUB_REF_NAME: a package release needs a release in cheesecloth.pin"
              exit 1
            fi
            if [[ ! "$GITHUB_REF_NAME" =~ ^v${release//./\\.}-[1-9][0-9]*$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME must be v$release-<revision>"
              exit 1
            fi
            echo "package=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # Gets the pinned cheesecloth binary in bin/cheesecloth: built from source
  # at a pinned commit, or downloaded from a pinned release and checked
  # against the pin. The tests run in cheesecloth's own CI.
  binary:
    name: Binary (${{ matrix.arch }})
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.pin.outputs.commit
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.commit }}
          persist-credentials: false
      - name: Select stable Rust
        if: needs.pin.outputs.commit
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.pin.outputs.commit
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        if: needs.pin.outputs.commit
        run: |
          cargo build --release --locked -p cheesecloth
          mkdir -p bin
          cp target/release/cheesecloth bin/cheesecloth
      - name: Download
        if: needs.pin.outputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.pin.outputs.release }}
          TARGET: ${{ matrix.target }}
          SHA256: ${{ fromJSON(needs.pin.outputs.sha256 || '{}')[matrix.target] }}
        run: |
          mkdir -p bin
          gh release download "v$RELEASE" -R jdpanderson/cheesecloth \
            -p "cheesecloth-$RELEASE-$TARGET" -O bin/cheesecloth
          read -r hash _ < <(shasum -a 256 bin/cheesecloth)
          if [[ "$hash" != "$SHA256" ]]; then
            echo "::error::cheesecloth-$RELEASE-$TARGET has SHA-256 $hash, but cheesecloth.pin says $SHA256"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-binary-${{ matrix.arch }}
          path: bin/cheesecloth
          if-no-files-found: error

  # The app's unit tests, with the local API examples from the commit or tag
  # of the binary.
  test:
    name: Swift tests
    needs: pin
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.ref }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - name: Test
        env:
          CHEESECLOTH_API_DOC: ${{ github.workspace }}/cheesecloth/docs/LOCAL-API.md
        run: swift test --package-path app

  # Builds the universal app from the binaries of the binary job. It never
  # runs cargo.
  app:
    name: App
    needs: [pin, binary]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The README, LICENSE, notices and docs that the app holds, from the
      # commit or tag of the binary.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.ref }}
          path: cheesecloth
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: target/bin
          pattern: macos-binary-*
      # Artifacts do not keep file modes.
      - name: Build app
        run: |
          chmod +x target/bin/*/cheesecloth
          bash build.sh cheesecloth \
            target/bin/macos-binary-arm64/cheesecloth target/bin/macos-binary-x86_64/cheesecloth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesecloth-macos-app
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  # Publishes a package release for a tag v<release>-<revision>, after every
  # check passed. The app is signed ad hoc and not notarized; see Weak points
  # in README.md.
  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [lint, pin, test, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesecloth-macos-app
          path: dist
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ needs.pin.outputs.package }}
          RELEASE: ${{ needs.pin.outputs.release }}
        run: |
          # Only a plain X.Y.Z release of cheesecloth makes a full release; a
          # suffix such as "pre0" makes a pre-release.
          flags=()
          if [[ ! "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          dmg=(dist/*.dmg)
          if [[ ${#dmg[@]} -ne 1 || ! -f "${dmg[0]}" ]]; then
            echo "::error::expected one disk image, found: ${dmg[*]}"
            exit 1
          fi
          mkdir release
          cp "${dmg[0]}" "release/Cheesecloth-$PACKAGE-macos.dmg"
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --verify-tag --title "$PACKAGE" --generate-notes "${flags[@]}" \
            --notes "The macOS app (universal, signed ad hoc, not notarized) for cheesecloth $RELEASE." -- *
